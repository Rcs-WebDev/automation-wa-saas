name: Deploy Frontend ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bisa trigger manual dari GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya jalankan 1 deployment sekaligus
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          # Isi VITE_API_URL dengan URL Railway backend kamu
          # Set di: GitHub repo → Settings → Secrets → Actions → New secret
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload ke GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
